[options]
; Password master untuk membuat/menghapus database dari halaman /web/database.
; WAJIB GANTI sebelum dipakai — jangan biarkan nilai default.
admin_passwd = CHANGE_ME

db_host = db
db_port = 5432
; Harus sama dengan POSTGRES_USER / POSTGRES_PASSWORD di file .env
db_user = odoo18
db_password = CHANGE_ME
dbfilter =
; True saat pertama kali membuat database lewat browser; sesudah database
; jadi, ubah ke False dan restart container supaya Database Manager tidak
; bisa dibuka publik.
list_db = True

addons_path = /opt/odoo/addons,/mnt/extra-addons,/mnt/custom-addons
data_dir = /var/lib/odoo

; Limit memori: soft 2 GB / hard 3 GB. Nilai kecil (512/768 MB) terbukti
; membuat server reload di tengah upload ZIP besar via module_uploader
; (watchdog memori menembak proses threaded) — jangan diturunkan kecuali
; RAM VPS memang sangat kecil.
; Real-time (Discuss/chat/notifikasi) butuh workers >= 1: dengan workers = 0
; server longpolling tidak pernah menyala dan browser menampilkan
; "Real-time connection lost". Default 2 worker cukup untuk VPS kecil;
; naikkan bila RAM lebih besar (patokan kasar: 2 worker per 1 CPU + cron).
workers = 2
longpolling_port = 8072
max_cron_threads = 1
limit_memory_soft = 2147483648
limit_memory_hard = 3221225472
limit_time_cpu = 600
limit_time_real = 1200

log_level = info
proxy_mode = False
